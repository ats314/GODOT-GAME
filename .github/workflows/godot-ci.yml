name: game-ci

on:
  push:
    paths:
      - "game/**"
      - ".github/workflows/godot-ci.yml"
  pull_request:
    paths:
      - "game/**"
      - ".github/workflows/godot-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-4.7.1-stable-linux

      - name: Download Godot 4.7.1
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          unzip -o godot.zip
          mv Godot_v4.7.1-stable_linux.x86_64 godot
          chmod +x godot

      - name: Import project
        run: ~/godot/godot --headless --path game --import 2>&1 | tee import.log

      - name: Boot both scenes headless
        run: |
          ~/godot/godot --headless --path game res://scenes/main_menu.tscn --quit-after 300 2>&1 | tee boot.log
          ~/godot/godot --headless --path game res://scenes/run.tscn --quit-after 300 2>&1 | tee -a boot.log

      - name: Fail on script errors
        run: |
          if grep -iE "SCRIPT ERROR|Parse Error|ERROR:" import.log boot.log | grep -viE "vulkan|opengl|xdg|alsa|pulse|audio|dummy"; then
            echo "Engine reported errors (above)."
            exit 1
          fi
          echo "Clean: no script errors."
