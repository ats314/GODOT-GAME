name: library-ci

# The game project was removed along with the abandoned ACCRETE concept, so there is
# no Godot project to import yet. What this repository ships right now is a reference
# library, and the thing that can rot silently is the generated indexes drifting from
# the files they describe. This job checks exactly that.
#
# The demos/ job below is that headless engine job, added as this comment asked: it uses
# tools/godot_smoke_test.sh for import + boot and then runs the demo's own soak test.

on:
  push:
    paths:
      - "library/**"
      - "third_party/**"
      - "tools/**"
      - "demos/**"
      - ".github/workflows/godot-ci.yml"
  pull_request:
    paths:
      - "library/**"
      - "third_party/**"
      - "tools/**"
      - "demos/**"
      - ".github/workflows/godot-ci.yml"

jobs:
  indexes-current:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate the API index
        run: python3 tools/build_api_index.py

      - name: Regenerate the code index
        run: python3 tools/build_code_index.py

      - name: Fail if the committed indexes are stale
        run: |
          if ! git diff --quiet -- library/; then
            echo "Generated indexes are out of date. Run these locally and commit the result:"
            echo "  python3 tools/build_api_index.py"
            echo "  python3 tools/build_code_index.py"
            git diff --stat -- library/
            exit 1
          fi
          echo "Indexes match the tree."

      - name: Validate the resource catalog
        run: |
          if [ -f library/catalog.json ]; then
            python3 tools/build_resource_index.py --check
          else
            echo "No library/catalog.json yet — skipping catalog validation."
          fi

  # Every Godot project under demos/ must import, boot and pass its own tests. The soak
  # test is the part that matters: a demo that boots but whose win condition has become
  # unreachable is worse than one that crashes, because nothing tells you.
  demos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache the engine binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/godot-bin
          key: godot-bin-4.7.1

      - name: HIGHBALL — import and boot
        run: tools/godot_smoke_test.sh demos/highball res://scenes/main.tscn

      - name: HIGHBALL — soak test (all three endings reachable)
        run: |
          BIN=~/.cache/godot-bin/Godot_v4.7.1-stable_linux.x86_64
          "$BIN" --headless --path demos/highball res://scenes/soak.tscn 2>&1 | tee soak.log
          grep -q "SOAK PASS" soak.log
