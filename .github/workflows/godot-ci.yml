name: library-ci

# The game project was removed along with the abandoned ACCRETE concept, so there is
# no Godot project to import yet. What this repository ships right now is a reference
# library, and the thing that can rot silently is the generated indexes drifting from
# the files they describe. This job checks exactly that.
#
# When a new game project lands, add a job here that runs the engine headlessly:
#   godot --headless --path <project> --import
#   godot --headless --path <project> <main scene> --quit-after 300
# and fails on "SCRIPT ERROR|Parse Error|ERROR:" (ignoring vulkan/opengl/alsa noise).

on:
  push:
    paths:
      - "library/**"
      - "third_party/**"
      - "tools/**"
      - ".github/workflows/godot-ci.yml"
  pull_request:
    paths:
      - "library/**"
      - "third_party/**"
      - "tools/**"
      - ".github/workflows/godot-ci.yml"

jobs:
  indexes-current:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate the API index
        run: python3 tools/build_api_index.py

      - name: Regenerate the code index
        run: python3 tools/build_code_index.py

      - name: Fail if the committed indexes are stale
        run: |
          if ! git diff --quiet -- library/; then
            echo "Generated indexes are out of date. Run these locally and commit the result:"
            echo "  python3 tools/build_api_index.py"
            echo "  python3 tools/build_code_index.py"
            git diff --stat -- library/
            exit 1
          fi
          echo "Indexes match the tree."

      - name: Validate the resource catalog
        run: |
          if [ -f library/catalog.json ]; then
            python3 tools/build_resource_index.py --check
          else
            echo "No library/catalog.json yet — skipping catalog validation."
          fi
