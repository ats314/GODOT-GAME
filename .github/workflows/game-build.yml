name: game-build

# Produces downloadable Windows and Linux builds of the demo, and checks that the
# demo still passes its own balance test. Exported binaries are ~100 MB, which is
# too big to hand around any other way, so CI artifacts are how a build actually
# reaches a player.
#
# Run it by hand from the Actions tab (Run workflow), or it runs on any push that
# touches the game.

on:
  push:
    paths:
      - "game/**"
      - ".github/workflows/game-build.yml"
  pull_request:
    paths:
      - "game/**"
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # The engine binary and the export templates are ~1.3 GB together and never
      # change for a pinned version, so they are cached rather than re-fetched.
      - name: Cache engine and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-with-templates

      - name: Install Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -oq godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot

          curl -sSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -oq templates.tpz -d /tmp/tpl
          mkdir -p ~/.local/share/godot/export_templates
          mv /tmp/tpl/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      # Importing twice is not superstition: the first pass generates the .godot
      # cache and UIDs, and resources that depend on those only resolve on a second
      # pass. Exporting off a half-built cache produces a broken binary.
      - name: Import project
        run: |
          ~/godot/godot --headless --path game --import 2>&1 | tail -3
          ~/godot/godot --headless --path game --import 2>&1 | tail -3

      - name: Boot the main scene headlessly
        run: |
          ~/godot/godot --headless --path game res://scenes/cockpit.tscn \
            --quit-after 300 2>&1 | tee boot.log
          if grep -iE "SCRIPT ERROR|Parse Error" boot.log; then
            echo "Engine reported script errors."
            exit 1
          fi

      # The balance harness exits non-zero if a scripted competent policy wins
      # outside the 35-90% band, so a number change that quietly ruins the fight
      # fails the build instead of reaching a player.
      - name: Balance check
        run: |
          ~/godot/godot --headless --path game \
            --script res://tests/balance_run.gd -- --runs=120 2>&1 | tee balance.log
          tail -3 balance.log

      - name: Export Windows and Linux
        run: |
          mkdir -p build/windows build/linux
          ~/godot/godot --headless --path game \
            --export-release "Windows Desktop" ../build/windows/KEEPALIVE.exe 2>&1 | tail -2
          ~/godot/godot --headless --path game \
            --export-release "Linux" ../build/linux/KEEPALIVE.x86_64 2>&1 | tail -2
          chmod +x build/linux/KEEPALIVE.x86_64
          ls -la build/windows build/linux

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: KEEPALIVE-windows
          path: build/windows/KEEPALIVE.exe
          if-no-files-found: error

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: KEEPALIVE-linux
          path: build/linux/KEEPALIVE.x86_64
          if-no-files-found: error
